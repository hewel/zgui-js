name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:build

  rust-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install native Linux graphics and font libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libfreetype-dev \
            libglvnd-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Fetch Cargo dependencies
        run: |
          cargo fetch --locked
          bun tools/test-vendor.mjs --fetch
      - run: bun run test:rust
      - run: bun run test:vendor
      # Run all cross-renderer headless preview suites (including strict comparison.test.mjs).
      # Hardware-pinned tests/preview/ci.test.mjs requires a runner-matched baseline for preview/baselines/counter.
      - name: Run headless preview tests (Lavapipe)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: bun run test:preview:ci
      - name: Upload retained preview failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-failure-artifacts
          path: |
            target/preview-*
            target/inspector-ui-*
          if-no-files-found: ignore
