[package]
name = "native-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
zgui.workspace = true
js-runtime.workspace = true
ui-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rquickjs.workspace = true
sourcemap.workspace = true
host-services.workspace = true
libc = "0.2"
# zgui-text-parley does not forward this feature; CJK layout analysis needs its dictionaries.
parley = { version = "=0.11.1", default-features = false, features = ["complex-scripts"] }
png = "=0.18.1"
toml = "=1.2.1"
zgui-platform-headless = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-render-wgpu = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-layout = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-dom = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-view-dom = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-css = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
accesskit = "=0.24.1"
accesskit_consumer = "=0.38.0"

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
zgui-view = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a", features = ["stub-backend"] }
zgui-a11y = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-testkit-scene = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
