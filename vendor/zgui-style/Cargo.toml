[package]
name = "zgui-style"
version = "0.1.0"
edition = "2024"
description = "Style engine for zgui documents, built on Stylo"
repository = "https://github.com/zortax/zgui"
homepage = "https://zgui.zortax.de"
rust-version = "1.90"
keywords = ["gui", "ui", "css", "reactive", "wgpu"]
categories = ["gui"]
include = ["/src", "/build", "/build.rs", "/README.md", "/LICENSE", "/NOTICE"]
license = "Apache-2.0 AND MPL-2.0"

# L4 — engines. Every dependency is inherited: `foo.workspace = true`.
[workspace]

[dependencies]
web-time = "1.1.0"
zgui-bits = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-css = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-dom = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-geom = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-interned = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-profile = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-text = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
# The shaping-key / breaking-key split is what says whether a style change costs a re-shape or
# only a re-break, and damage translation is its consumer.
zgui-text-style = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-vocab = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }

# The style engine itself. This crate drives it; nothing above it names any of these.
stylo = "=0.19.0"
stylo_dom = "=0.19.0"
selectors = "0.39.0"
servo_arc = "0.4.3"
cssparser = "0.37.0"

# The engine's own length unit and the geometry its device is built from, both of which appear in
# the signatures this crate has to write.
app_units = "0.7.8"
euclid = "0.22.14"

bitflags = "2.13"
rayon = "1.12"
rustc-hash = "2.1"
smallvec = "1.15"
serde = { version = "1", features = ["derive"] }
tracing = "0.1.44"

[dev-dependencies]
# The counters are compiled out of an optimised build unless this feature asks for them, and the
# budgets have to be readable from `cargo test --release` as well as from a debug build.
zgui-profile = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba", features = ["counters"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[patch."https://github.com/zortax/zgui"]
zgui-dom = { path = "../zgui-dom" }
zgui-style = { path = "." }
