[package]
name = "zgui-platform-wayland"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Wayland platform backend for zgui"
repository = "https://github.com/zortax/zgui"
homepage = "https://zgui.zortax.de"
rust-version = "1.90"

# Standalone snapshot of upstream ee29c7dc; sibling crates retain the same revision.
[workspace]

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
accesskit = "0.24.1"
accesskit_unix = "0.22.1"
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
futures = { version = "0.3", features = ["thread-pool"] }
raw-window-handle = "0.6.2"
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "mm", "event", "time"] }
smithay-client-toolkit = "0.20.0"
tracing = "0.1.44"
wayland-backend = { version = "0.3.16", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-scanner = "0.31.11"
zbus = "5.18"
zgui-geom = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-layout = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-platform = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-profile = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-vocab = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "net"] }
sha2 = "0.10"
tracing = "0.1.44"
tracing-subscriber = "0.3"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
zgui-elements = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-platform-headless = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-render = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-render-wgpu = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-runtime = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-testkit-scene = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-view = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }

[[test]]
name = "frame_chain"
path = "tests/frame_chain.rs"
harness = false

[[test]]
name = "pointer_stream"
path = "tests/pointer_stream.rs"
harness = false

[[test]]
name = "occlusion"
path = "tests/occlusion.rs"
harness = false

[[test]]
name = "clipboard"
path = "tests/clipboard.rs"
harness = false

[[test]]
name = "file_drop"
path = "tests/file_drop.rs"
harness = false

[[test]]
name = "wake_idle"
path = "tests/wake_idle.rs"
harness = false

[[test]]
name = "wake_signal"
path = "tests/wake_signal.rs"
harness = false

[[test]]
name = "output_rate"
path = "tests/output_rate.rs"
harness = false

[[test]]
name = "layer_shell"
path = "tests/layer_shell.rs"
harness = false

[[test]]
name = "hidden_layer"
path = "tests/hidden_layer.rs"
harness = false

[[test]]
name = "layer_toggle"
path = "tests/layer_toggle.rs"
harness = false

[[test]]
name = "fatal_error"
path = "tests/fatal_error.rs"
harness = false

[[test]]
name = "connection_lost"
path = "tests/connection_lost.rs"
harness = false

[[test]]
name = "monitors"
path = "tests/monitors.rs"
harness = false

[[test]]
name = "focus_grab"
path = "tests/focus_grab.rs"
harness = false

[[test]]
name = "layer_popup"
path = "tests/layer_popup.rs"
harness = false

[[test]]
name = "session_lock"
path = "tests/session_lock.rs"
harness = false

[[test]]
name = "lock_keys"
path = "tests/lock_keys.rs"
harness = false

[[test]]
name = "wall_clock"
path = "tests/wall_clock.rs"
harness = false
required-features = ["wall-clock"]

[features]
wall-clock = []

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[patch."https://github.com/zortax/zgui"]
zgui-dom = { path = "../zgui-dom" }
zgui-platform = { path = "../zgui-platform" }
zgui-platform-headless = { path = "../zgui-platform-headless" }
zgui-view-dom = { path = "../zgui-view-dom" }
zgui-view = { path = "../zgui-view" }
zgui-paint = { path = "../zgui-paint" }
zgui-render-wgpu = { path = "../zgui-render-wgpu" }
zgui-layout = { path = "../zgui-layout" }
zgui-scroll = { path = "../zgui-scroll" }
zgui-runtime = { path = "../zgui-runtime" }
zgui-input = { path = "../zgui-input" }
zgui-a11y = { path = "../zgui-a11y" }
zgui-style = { path = "../zgui-style" }
