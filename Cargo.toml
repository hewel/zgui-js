[workspace]
resolver = "3"
members = ["crates/native-host", "crates/js-runtime", "crates/ui-bridge", "crates/host-services"]
exclude = ["vendor/zgui-runtime", "vendor/zgui-platform", "vendor/zgui-platform-headless", "vendor/zgui-platform-wayland", "vendor/zgui-view-dom", "vendor/zgui-view", "vendor/zgui", "vendor/zgui-text-parley", "vendor/zgui-paint", "vendor/zgui-layout", "vendor/zgui-dom", "vendor/zgui-style", "vendor/zgui-scroll"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
zgui = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "73fcd6062ee615aeb2a4675cd32be67a56e93973", default-features = false, features = ["std", "macro"] }
libc = "0.2"
roxmltree = "0.21"
js-runtime = { path = "crates/js-runtime" }
ui-bridge = { path = "crates/ui-bridge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sourcemap = "9.3.2"

host-services = { path = "crates/host-services" }

[patch.crates-io]
fontique = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }

[patch."https://github.com/zortax/zgui"]
zgui-dom = { path = "vendor/zgui-dom" }
zgui-runtime = { path = "vendor/zgui-runtime" }
zgui-platform = { path = "vendor/zgui-platform" }
zgui-platform-headless = { path = "vendor/zgui-platform-headless" }
zgui-platform-wayland = { path = "vendor/zgui-platform-wayland" }
zgui-view-dom = { path = "vendor/zgui-view-dom" }
zgui-paint = { path = "vendor/zgui-paint" }
zgui-layout = { path = "vendor/zgui-layout" }
zgui-style = { path = "vendor/zgui-style" }
zgui-scroll = { path = "vendor/zgui-scroll" }
zgui-view = { path = "vendor/zgui-view" }
zgui = { path = "vendor/zgui" }
zgui-text-parley = { path = "vendor/zgui-text-parley" }
