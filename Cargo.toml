[workspace]
resolver = "3"
members = ["crates/zgui-host", "crates/js-runtime", "crates/ui-bridge", "crates/host-services"]
exclude = [
  "vendor/zgui-runtime",
  "vendor/zgui-platform",
  "vendor/zgui-platform-headless",
  "vendor/zgui-platform-wayland",
  "vendor/zgui-view-dom",
  "vendor/zgui-view",
  "vendor/zgui",
  "vendor/zgui-text-parley",
  "vendor/zgui-paint",
  "vendor/zgui-layout",
  "vendor/zgui-dom",
  "vendor/zgui-input",
  "vendor/zgui-a11y",
  "vendor/zgui-style",
  "vendor/zgui-scroll",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
zgui = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "73fcd6062ee615aeb2a4675cd32be67a56e93973", default-features = false, features = [
  "std",
  "macro",
  "loader",
] }
libc = "0.2"
roxmltree = "0.21"
js-runtime = { path = "crates/js-runtime" }
ui-bridge = { path = "crates/ui-bridge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sourcemap = "9.3.2"
rusqlite = { version = "0.43", features = ["bundled"] }
notify = { version = "9.0", default-features = false }
zbus = "5.18"
tokio = { version = "1.54", features = [
  "rt-multi-thread",
  "net",
  "time",
  "sync",
  "io-util",
  "macros",
] }
url = "2.5"
bytes = "1.12"
flate2 = "1.1"
futures-util = "0.3"
http = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.28", default-features = false, features = [
  "connect",
  "handshake",
] }

host-services = { path = "crates/host-services" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[patch.crates-io]
fontique = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }

[patch."https://github.com/zortax/zgui"]
zgui-dom = { path = "vendor/zgui-dom" }
zgui-input = { path = "vendor/zgui-input" }
zgui-a11y = { path = "vendor/zgui-a11y" }
zgui-runtime = { path = "vendor/zgui-runtime" }
zgui-platform = { path = "vendor/zgui-platform" }
zgui-platform-headless = { path = "vendor/zgui-platform-headless" }
zgui-platform-wayland = { path = "vendor/zgui-platform-wayland" }
zgui-view-dom = { path = "vendor/zgui-view-dom" }
zgui-paint = { path = "vendor/zgui-paint" }
zgui-layout = { path = "vendor/zgui-layout" }
zgui-style = { path = "vendor/zgui-style" }
zgui-scroll = { path = "vendor/zgui-scroll" }
zgui-view = { path = "vendor/zgui-view" }
zgui = { path = "vendor/zgui" }
zgui-text-parley = { path = "vendor/zgui-text-parley" }
